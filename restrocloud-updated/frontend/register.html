<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - RestroCloud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8D%BD%EF%B8%8F</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">RestroCloud</a>
        <div class="nav-links">
            <a href="restaurants.html">Browse Restaurants</a>
            <span id="auth-links"></span>
        </div>
    </nav>

    <main class="container">
        <div class="auth-wrapper">
            <div class="auth-icon">👋</div>
            <h1>Create an Account</h1>
            <p class="muted">Join as a customer, or as an owner to list your restaurant.</p>

            <form id="register-form" class="form-card">
                <label>Full Name</label>
                <input type="text" id="name" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Password</label>
                <input type="password" id="password" required minlength="6">

                <div id="customer-address-field">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" rows="3" maxlength="255" placeholder="House/flat, street, area, city" required></textarea>
                </div>

                <label for="role">I am a</label>
                <select id="role">
                    <option value="customer">Customer</option>
                    <option value="owner">Restaurant Owner</option>
                </select>

                <button type="submit">Register</button>
            </form>
            <p id="message" class="error"></p>
            <p class="muted">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="nav.js"></script>
    <script>
        const roleSelect = document.getElementById("role");
        const addressField = document.getElementById("customer-address-field");
        const addressInput = document.getElementById("address");

        function updateAddressRequirement() {
            const isCustomer = roleSelect.value === "customer";
            addressField.style.display = isCustomer ? "block" : "none";
            addressInput.required = isCustomer;
        }
        roleSelect.addEventListener("change", updateAddressRequirement);
        updateAddressRequirement();

        document.getElementById("register-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const payload = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                role: roleSelect.value,
                address: roleSelect.value === "customer" ? addressInput.value.trim() : "",
            };

            try {
                await apiRequest("/register", "POST", payload);
                window.location.href = "login.html";
            } catch (error) {
                document.getElementById("message").textContent = error.message;
            }
        });
    </script>
</body>
</html>
