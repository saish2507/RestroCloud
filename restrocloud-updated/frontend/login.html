<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - RestroCloud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8D%BD%EF%B8%8F</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="brand">RestroCloud</a>
        <div class="nav-links">
            <a href="restaurants.html">Browse Restaurants</a>
            <span id="auth-links"></span>
        </div>
    </nav>

    <main class="container">
        <div class="auth-wrapper">
            <div class="auth-icon">🔐</div>
            <h1>Welcome back</h1>
            <p class="muted">Log in to manage your restaurant or browse your favorites.</p>

            <form id="login-form" class="form-card">
                <label>Email</label>
                <input type="email" id="email" required>

                <label>Password</label>
                <input type="password" id="password" required>

                <button type="submit">Login</button>
            </form>
            <p id="message" class="error"></p>
            <p class="muted">Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="nav.js"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const payload = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
            };

            try {
                const data = await apiRequest("/login", "POST", payload);
                saveLogin(data.token, data.user);
                window.location.href = "index.html";
            } catch (error) {
                document.getElementById("message").textContent = error.message;
            }
        });
    </script>
</body>
</html>
